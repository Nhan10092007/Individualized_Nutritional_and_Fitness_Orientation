services:
      # 1. Backend API (FastAPI)
      - type: web
        name: fitness-nutrition-api
        runtime: python
        plan: free
        rootDir: backend
        buildCommand: pip install -r requirements.txt
        startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
        envVars:
          - key: DATABASE_URL
            sync: false
          - key: JWT_SECRET_KEY
            generateValue: true
    
      # 2. Frontend Web (React + Vite)
      - type: web
        name: fitness-nutrition-web
        runtime: static
        rootDir: frontend
        buildCommand: npm install && npm run build
        staticPublishPath: ./dist
        envVars:
          - key: VITE_API_URL
            sync: false
        routes:
          - type: rewrite
            source: /*
            destination: /index.html